[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  NETLIFY_COLLAB_TOOLS = "false"
  NETLIFY_DRAWER = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/hero-bg.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/settlement-bg.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gpp-logo.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "http://globalpensionpolicy.com/*"
  to = "https://globalpensionpolicy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.globalpensionpolicy.com/*"
  to = "https://globalpensionpolicy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.globalpensionpolicy.com/*"
  to = "https://globalpensionpolicy.com/:splat"
  status = 301
  force = true
